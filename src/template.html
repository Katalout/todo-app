<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toodoo doo-do-do-do-do-do-doo</title>
</head>

<body>
    <header>
        <h1>What do you need to do <img src="noun-baby-shark-1881439.png" alt="baby shark" height="40px"> <span>
                do <span>
                    do <span>
                        do <span>
                            do <span>
                                do
                                <span>doo?</span>
                            </span>
                        </span>
                    </span>
                </span>
            </span><img src="noun-baby-shark-1881439.png" alt="baby shark" height="20px"></h1><button type="button"
            command="show-modal" commandfor="add-todo">+</button>
    </header>
    <div class="sidebar">projects</div>
    <main>list of todos</main>
    <footer>baby shark by Saeful Muslim from <a href="https://thenounproject.com/browse/icons/term/baby-shark/"
            target="_blank" title="baby shark Icons">Noun Project</a> (CC BY 3.0)</footer>
</body>

<dialog id="add-todo">
    <form>
        <div class="flex">
            <label for="title">Title: </label><input type="text" id="title" name="title">
            <label for="project">Project: </label><input type="text" id="project" name="project" value="generic">
            <label for="description">Description: </label><textarea id="description" name="description" rows="2"
                cols="20" placeholder="blah blah.."></textarea>
            <label for="dueDate">Due on: </label>
            <input type="date" name="dueDate" id="dueDate" value="2026-06-01" min="2026-05-01">
            <label for="priority">Priority: </label><select name="priority" id="priority">
                <option value="Low">Low</option>
                <option value="Normal">Normal</option>
                <option value="High">High</option>
            </select>
        </div>
        <button value="cancel" formmethod="dialog">Cancel</button>
        <button value="submit" type="button" id="confirm">Submit</button>
    </form>
</dialog>

</html>
